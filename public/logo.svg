<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="blueToViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0033BB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7700FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Top horizontal bar -->
  <rect x="180" y="140" width="440" height="90" fill="url(#blueToViolet)" rx="20"/>
  
  <!-- Diagonal accent top right -->
  <polygon points="520,140 640,140 600,220 480,220" fill="#7700FF" opacity="0.9"/>
  
  <!-- Vertical stem -->
  <rect x="320" y="260" width="160" height="320" fill="url(#blueToViolet)" rx="15"/>
  
  <!-- Bottom curved section -->
  <path d="M 180 480 Q 180 620 320 660 L 480 660 Q 620 620 620 480" fill="url(#blueToViolet)" stroke="none"/>
  
  <!-- Diagonal accent bottom right -->
  <polygon points="480,520 580,420 640,480 540,580" fill="#7700FF" opacity="0.85"/>
</svg>
